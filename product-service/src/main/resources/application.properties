# application.properties for Product Service
#server.port=8080
server.port=8081
# A4 productDB base URL(local)
productdb.base-url=http://localhost:8080

logging.pattern.console=%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n

spring.application.name=product-service

# Bad service mode configuration (default: false for good service)
bad.service.mode=${BAD_SERVICE_MODE:false}

# Actuator
# Expose health and info endpoints
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always
# The default path is /actuator, so health is at /actuator/health